{% extends "layout.html" %}

{% block title %}
    Sell
{% endblock %}

{% block main %}
        <form action="/sell" method="post">
            <div class="mb-3">
                <select name="symbol" class="form-control mx-auto w-auto">
                    <option disabled selected>Stock</option>
                    {% for stock in stocks %}
                        <option value="{{stock}}">{{stock}}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="shares" placeholder="Quantity" type="number">
            </div>
            <button class="btn btn-primary" type="submit">Sell </button>
        </form>

{% endblock %}
